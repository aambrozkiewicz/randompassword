[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randompassword"
version = "0.1.0"
description = "Generate random passwords from the command line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1"]

[project.scripts]
randompassword = "main:generate_string"

[tool.setuptools]
py-modules = ["main"]
